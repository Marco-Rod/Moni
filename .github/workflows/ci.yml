name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: finanzas
          POSTGRES_PASSWORD: test
          POSTGRES_DB: finanzas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finanzas"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://finanzas:test@localhost:5432/finanzas_test
      OLLAMA_BASE_URL: http://localhost:11434
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Habilitar pgvector
        run: PGPASSWORD=test psql -h localhost -U finanzas -d finanzas_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: alembic upgrade head
      - run: pytest

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build ./backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
